<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiplication Table</title>
    <link rel="stylesheet" href="stylesheet.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<section class="container">
    <h1>Multiplication Table Project</h1>

    <div class="generate-box">
        <div class="inputs">
            <label>Rows:
                <input id="rows" type="number" value="10" />
            </label>
            <label>Columns:
                <input id="cols" type="number" value="10" />
            </label>
            <label>Highlight:
                <input id="highlight" type="number" placeholder="Row & column to highlight" />
            </label>
        </div>

        <button id="generate" class="myBtn"
                onclick="createWithHtmlTable(getInputValueAsNumber('rows'), getInputValueAsNumber('cols'), getInputValueAsNumber('highlight'))">
            Generate TABLE!
        </button>
    </div>

    <section id="output"></section>
</section>

<script src="javascript.js"></script>
</body>
</html>
